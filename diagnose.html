<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1565c0">

<link rel="manifest" href="manifest.json">

<title>PWA-Diagnose</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f2f4f7;
        color: #202124;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
    }

    main {
        max-width: 700px;
        margin: 0 auto;
    }

    .karte {
        background: white;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
        color: #1565c0;
    }

    h2 {
        margin-top: 0;
    }

    .pruefung {
        padding: 11px 12px;
        margin: 7px 0;
        border-radius: 7px;
        word-break: break-word;
    }

    .ok {
        background: #e8f5e9;
        color: #1b5e20;
    }

    .fehler {
        background: #ffebee;
        color: #b71c1c;
    }

    .warnung {
        background: #fff8e1;
        color: #795548;
    }

    .info {
        background: #e3f2fd;
        color: #0d47a1;
    }

    .symbol {
        display: inline-block;
        width: 25px;
        font-weight: bold;
    }

    code {
        word-break: break-all;
    }

    pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.85rem;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #1565c0;
        color: white;
        font-size: 1rem;
        cursor: pointer;
    }

    button:hover {
        background: #0d47a1;
    }

    .klein {
        color: #666;
        font-size: 0.9rem;
    }
</style>

</head> <body> <main>
<div class="karte">
    <h1>PWA-Diagnose</h1>

    <p>
        Diese Seite prüft die Voraussetzungen für die
        installierbare Multiple-Choice-PWA.
    </p>

    <p class="klein">
        Aktuelle URL:
        <br>
        <code id="aktuelleUrl"></code>
    </p>
</div>

<div class="karte">

    <h2>Grundvoraussetzungen</h2>

    <div id="grund"></div>

</div>

<div class="karte">

    <h2>Manifest</h2>

    <div id="manifest"></div>

</div>

<div class="karte">

    <h2>Icons</h2>

    <div id="icons"></div>

</div>

<div class="karte">

    <h2>Service Worker</h2>

    <div id="serviceWorker"></div>

</div>

<div class="karte">

    <h2>Browserinformationen</h2>

    <div id="browser"></div>

</div>

<div class="karte">

    <h2>Zusammenfassung</h2>

    <div id="zusammenfassung">
        Diagnose läuft …
    </div>

    <button onclick="location.reload()">
        Erneut prüfen
    </button>

</div>

</main> <script>
"use strict";

/* ============================================================
ZÄHLER
============================================================ */

let ok = 0;
let fehler = 0;
let warnungen = 0;

/* ============================================================
HILFSFUNKTIONEN
============================================================ */

function escapeHtml(text) {

return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function ausgabe(
containerId,
status,
titel,
text = ""
) {

const container =
    document.getElementById(containerId);

const div =
    document.createElement("div");

div.className =
    "pruefung " + status;

let symbol = "ℹ";

if (status === "ok") {
    symbol = "✓";
    ok++;
}

if (status === "fehler") {
    symbol = "✗";
    fehler++;
}

if (status === "warnung") {
    symbol = "!";
    warnungen++;
}

div.innerHTML =
    `<span class="symbol">${symbol}</span>` +
    `<strong>${escapeHtml(titel)}</strong>` +
    (
        text
            ? `<br><span>${escapeHtml(text)}</span>`
            : ""
    );

container.appendChild(div);

}

/* ============================================================
URL
============================================================ */

document.getElementById("aktuelleUrl")
.textContent = window.location.href;

/* ============================================================
GRUNDVORAUSSETZUNGEN
============================================================ */

function pruefeGrundvoraussetzungen() {

if (window.location.protocol === "https:") {

    ausgabe(
        "grund",
        "ok",
        "HTTPS aktiv",
        window.location.origin
    );

} else {

    ausgabe(
        "grund",
        "fehler",
        "Kein HTTPS",
        "Eine PWA auf dieser Adresse benötigt einen sicheren Kontext."
    );
}

if ("serviceWorker" in navigator) {

    ausgabe(
        "grund",
        "ok",
        "Service Worker wird vom Browser unterstützt"
    );

} else {

    ausgabe(
        "grund",
        "fehler",
        "Service Worker wird nicht unterstützt"
    );
}

const manifestLink =
    document.querySelector(
        'link[rel="manifest"]'
    );

if (manifestLink) {

    ausgabe(
        "grund",
        "ok",
        "Manifest ist in HTML verknüpft",
        manifestLink.href
    );

} else {

    ausgabe(
        "grund",
        "fehler",
        "Kein Manifest-Link gefunden"
    );
}

}

/* ============================================================
MANIFEST
============================================================ */

async function pruefeManifest() {

try {

    const response =
        await fetch(
            "./manifest.json",
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        ausgabe(
            "manifest",
            "fehler",
            "manifest.json nicht erreichbar",
            `HTTP ${response.status}`
        );

        return null;
    }

    ausgabe(
        "manifest",
        "ok",
        "manifest.json erreichbar",
        `HTTP ${response.status}`
    );

    const text =
        await response.text();

    let manifest;

    try {

        manifest =
            JSON.parse(text);

    } catch (error) {

        ausgabe(
            "manifest",
            "fehler",
            "Manifest enthält ungültiges JSON",
            error.message
        );

        const pre =
            document.createElement("pre");

        pre.textContent = text;

        document.getElementById("manifest")
            .appendChild(pre);

        return null;
    }

    ausgabe(
        "manifest",
        "ok",
        "Manifest enthält gültiges JSON"
    );

    if (manifest.name) {

        ausgabe(
            "manifest",
            "ok",
            "name vorhanden",
            manifest.name
        );

    } else {

        ausgabe(
            "manifest",
            "fehler",
            "name fehlt"
        );
    }

    if (manifest.short_name) {

        ausgabe(
            "manifest",
            "ok",
            "short_name vorhanden",
            manifest.short_name
        );

    } else {

        ausgabe(
            "manifest",
            "warnung",
            "short_name fehlt"
        );
    }

    if (manifest.start_url) {

        const startUrl =
            new URL(
                manifest.start_url,
                window.location.href
            );

        ausgabe(
            "manifest",
            "ok",
            "start_url vorhanden",
            startUrl.href
        );

    } else {

        ausgabe(
            "manifest",
            "fehler",
            "start_url fehlt"
        );
    }

    if (manifest.scope) {

        const scope =
            new URL(
                manifest.scope,
                window.location.href
            );

        ausgabe(
            "manifest",
            "ok",
            "scope vorhanden",
            scope.href
        );

    } else {

        ausgabe(
            "manifest",
            "warnung",
            "scope fehlt"
        );
    }

    if (manifest.display) {

        ausgabe(
            "manifest",
            "ok",
            "display vorhanden",
            manifest.display
        );

    } else {

        ausgabe(
            "manifest",
            "warnung",
            "display fehlt"
        );
    }

    if (
        Array.isArray(manifest.icons) &&
        manifest.icons.length > 0
    ) {

        ausgabe(
            "manifest",
            "ok",
            "Icons im Manifest vorhanden",
            `${manifest.icons.length} Einträge`
        );

    } else {

        ausgabe(
            "manifest",
            "fehler",
            "Keine Icons im Manifest"
        );
    }

    const pre =
        document.createElement("pre");

    pre.textContent =
        JSON.stringify(
            manifest,
            null,
            2
        );

    document.getElementById("manifest")
        .appendChild(pre);

    return manifest;

} catch (error) {

    ausgabe(
        "manifest",
        "fehler",
        "Manifest konnte nicht geladen werden",
        error.message
    );

    return null;
}

}

/* ============================================================
ICONS
============================================================ */

async function pruefeIcon(
dateiname,
erwarteteGroesse
) {

try {

    const response =
        await fetch(
            `./${dateiname}`,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        ausgabe(
            "icons",
            "fehler",
            `${dateiname} nicht erreichbar`,
            `HTTP ${response.status}`
        );

        return;
    }

    const blob =
        await response.blob();

    if (!blob.type.startsWith("image/")) {

        ausgabe(
            "icons",
            "fehler",
            `${dateiname} ist kein Bild`,
            `MIME-Typ: ${blob.type}`
        );

        return;
    }

    const url =
        URL.createObjectURL(blob);

    const image =
        new Image();

    image.onload = () => {

        URL.revokeObjectURL(url);

        if (
            image.width === erwarteteGroesse &&
            image.height === erwarteteGroesse
        ) {

            ausgabe(
                "icons",
                "ok",
                `${dateiname} korrekt`,
                `${image.width} × ${image.height} Pixel`
            );

        } else {

            ausgabe(
                "icons",
                "warnung",
                `${dateiname} hat eine unerwartete Größe`,
                `${image.width} × ${image.height}; erwartet ${erwarteteGroesse} × ${erwarteteGroesse}`
            );
        }
    };

    image.onerror = () => {

        URL.revokeObjectURL(url);

        ausgabe(
            "icons",
            "fehler",
            `${dateiname} ist kein gültiges Bild`
        );
    };

    image.src = url;

} catch (error) {

    ausgabe(
        "icons",
        "fehler",
        `${dateiname} konnte nicht geprüft werden`,
        error.message
    );
}

}

/* ============================================================
SERVICE WORKER
============================================================ */

async function pruefeServiceWorker() {

if (!("serviceWorker" in navigator)) {
    return;
}

const swUrl =
    new URL(
        "./service-worker.js",
        window.location.href
    ).href;

/*
 * 1. Zuerst prüfen wir, ob die Datei überhaupt
 *    von GitHub Pages ausgeliefert wird.
 */

try {

    const response =
        await fetch(
            swUrl,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        ausgabe(
            "serviceWorker",
            "fehler",
            "service-worker.js nicht erreichbar",
            `HTTP ${response.status} – ${swUrl}`
        );

        return;
    }

    const text =
        await response.text();

    ausgabe(
        "serviceWorker",
        "ok",
        "service-worker.js ist erreichbar",
        `${swUrl} – ${text.length} Zeichen`
    );

    /*
     * Wenn HTML statt JavaScript zurückkommt,
     * liegt sehr wahrscheinlich ein falscher Pfad vor.
     */

    const ersterTeil =
        text.trim()
            .substring(0, 100)
            .toLowerCase();

    if (
        ersterTeil.startsWith("<!doctype") ||
        ersterTeil.startsWith("<html") ||
        ersterTeil.startsWith("<head")
    ) {

        ausgabe(
            "serviceWorker",
            "fehler",
            "service-worker.js liefert HTML",
            "GitHub Pages liefert vermutlich eine Fehlerseite statt der JavaScript-Datei."
        );

        return;
    }

} catch (error) {

    ausgabe(
        "serviceWorker",
        "fehler",
        "service-worker.js konnte nicht geladen werden",
        error.message
    );

    return;
}

/*
 * 2. Jetzt registrieren wir den Service Worker
 *    ausdrücklich von dieser Diagnose-Seite.
 */

try {

    ausgabe(
        "serviceWorker",
        "info",
        "Registrierung wird versucht",
        swUrl
    );

    const registration =
        await navigator.serviceWorker.register(
            "./service-worker.js",
            {
                scope: "./"
            }
        );

    ausgabe(
        "serviceWorker",
        "ok",
        "Service Worker wurde registriert",
        registration.scope
    );

    /*
     * Installationsstatus beobachten
     */

    if (registration.installing) {

        ausgabe(
            "serviceWorker",
            "info",
            "Service Worker wird installiert"
        );

        await new Promise(resolve => {

            const worker =
                registration.installing;

            if (!worker) {
                resolve();
                return;
            }

            worker.addEventListener(
                "statechange",
                () => {

                    ausgabe(
                        "serviceWorker",
                        "info",
                        "Worker-Status",
                        worker.state
                    );

                    if (
                        worker.state === "installed" ||
                        worker.state === "activated" ||
                        worker.state === "redundant"
                    ) {
                        resolve();
                    }
                }
            );
        });
    }

    /*
     * Registrierung erneut auslesen
     */

    const aktuelleRegistrierung =
        await navigator.serviceWorker
            .getRegistration();

    if (!aktuelleRegistrierung) {

        ausgabe(
            "serviceWorker",
            "fehler",
            "Registrierung ist anschließend nicht auffindbar"
        );

        return;
    }

    if (
        aktuelleRegistrierung.active
    ) {

        ausgabe(
            "serviceWorker",
            "ok",
            "Service Worker ist aktiv",
            aktuelleRegistrierung.active.scriptURL
        );

    } else if (
        aktuelleRegistrierung.waiting
    ) {

        ausgabe(
            "serviceWorker",
            "warnung",
            "Service Worker wartet auf Aktivierung"
        );

    } else if (
        aktuelleRegistrierung.installing
    ) {

        ausgabe(
            "serviceWorker",
            "warnung",
            "Service Worker wird noch installiert"
        );

    } else {

        ausgabe(
            "serviceWorker",
            "warnung",
            "Service Worker registriert, aber noch nicht aktiv"
        );
    }

    /*
     * Scope prüfen
     */

    const scopeUrl =
        new URL(
            aktuelleRegistrierung.scope
        );

    const diagnoseUrl =
        new URL(
            window.location.href
        );

    if (
        diagnoseUrl.href.startsWith(
            scopeUrl.href
        )
    ) {

        ausgabe(
            "serviceWorker",
            "ok",
            "Diagnose-Seite liegt im Service-Worker-Scope",
            scopeUrl.href
        );

    } else {

        ausgabe(
            "serviceWorker",
            "fehler",
            "Diagnose-Seite liegt außerhalb des Service-Worker-Scope",
            scopeUrl.href
        );
    }

} catch (error) {

    ausgabe(
        "serviceWorker",
        "fehler",
        "Service Worker konnte NICHT registriert werden",
        error.name + ": " + error.message
    );

    /*
     * Zusätzliche Hinweise für typische Fehler
     */

    if (
        error.message
            .toLowerCase()
            .includes("script")
    ) {

        ausgabe(
            "serviceWorker",
            "warnung",
            "Hinweis",
            "Prüfe insbesondere, ob service-worker.js tatsächlich JavaScript enthält und unter der erwarteten URL liegt."
        );
    }
}

}

/* ============================================================
BROWSER
============================================================ */

function zeigeBrowser() {

const daten = [
    [
        "User-Agent",
        navigator.userAgent
    ],
    [
        "Online",
        navigator.onLine
            ? "Ja"
            : "Nein"
    ],
    [
        "Protokoll",
        window.location.protocol
    ],
    [
        "Origin",
        window.location.origin
    ],
    [
        "Hostname",
        window.location.hostname
    ],
    [
        "Service Worker API",
        "serviceWorker" in navigator
            ? "vorhanden"
            : "nicht vorhanden"
    ],
    [
        "Manifest API",
        "BeforeInstallPromptEvent" in window
            ? "BeforeInstallPromptEvent vorhanden"
            : "nicht vorhanden"
    ]
];

daten.forEach(([name, wert]) => {

    ausgabe(
        "browser",
        "info",
        name,
        wert
    );
});

}

/* ============================================================
ZUSAMMENFASSUNG
============================================================ */

function zeigeZusammenfassung() {

const container =
    document.getElementById(
        "zusammenfassung"
    );

if (fehler === 0) {

    container.innerHTML = `
        <div class="pruefung ok">
            <span class="symbol">✓</span>
            <strong>
                Keine offensichtlichen technischen Fehler gefunden.
            </strong>
        </div>
    `;

} else {

    container.innerHTML = `
        <div class="pruefung fehler">
            <span class="symbol">✗</span>
            <strong>
                ${fehler} Fehler gefunden.
            </strong>
        </div>
    `;
}

if (warnungen > 0) {

    container.innerHTML += `
        <div class="pruefung warnung">
            <span class="symbol">!</span>
            ${warnungen} Warnung(en) gefunden.
        </div>
    `;
}

container.innerHTML += `
    <div class="pruefung info">
        <strong>
            ${ok} OK,
            ${fehler} Fehler,
            ${warnungen} Warnungen
        </strong>
    </div>
`;

}

/* ============================================================
START
============================================================ */

async function starteDiagnose() {

pruefeGrundvoraussetzungen();

zeigeBrowser();

await pruefeManifest();

await pruefeIcon(
    "icon-192.png",
    192
);

await pruefeIcon(
    "icon-512.png",
    512
);

await pruefeServiceWorker();

zeigeZusammenfassung();

}

starteDiagnose();

</script> </body> </html>
